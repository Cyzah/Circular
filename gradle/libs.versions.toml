[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compose = "1.12.2"
activity = "1.13.0"
miuix = "0.9.5-beta03"
libxposed = "102.0.0"
junit = "4.13.2"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
