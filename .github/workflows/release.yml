name: Build Release APK
run-name: Release APK · ${{ github.ref_name }} · ${{ inputs.edition || 'github' }} · ${{ inputs.release_mode || 'none' }}

on:
  workflow_dispatch:
    inputs:
      edition:
        description: '普通版（github）或 LSPosed 仓库版（lspRepo，仅下载）'
        type: choice
        required: true
        default: github
        options:
          - github
          - lspRepo
      release_mode:
        description: '发布方式：none 仅下载；draft 草稿；prerelease 预发布；release 正式版'
        type: choice
        required: true
        default: none
        options:
          - none
          - draft
          - prerelease
          - release
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: circular-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and optionally publish
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_EDITION: ${{ inputs.edition || 'github' }}
    defaults:
      run:
        shell: pwsh
        working-directory: Circular_Kotlin
    permissions:
      contents: write

    steps:

      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: Circular_Kotlin
          fetch-depth: 0
          persist-credentials: false

      - name: Check signing Secrets before building
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.Circular_KEYSTORE_B64 }}
          CIRCULAR_KEYSTORE_PASSWORD: ${{ secrets.Circular_STORE_PASS }}
          CIRCULAR_KEY_ALIAS: ${{ secrets.Circular_KEY_ALIAS }}
          CIRCULAR_KEY_PASSWORD: ${{ secrets.Circular_KEY_PASS }}
        run: ./tools/release-workflow.ps1 -Step CheckSigningSecrets

      - name: Prepare workspace and read-only runner tools
        run: ./tools/release-workflow.ps1 -Step PrepareWorkspace

      - name: Validate version and tag
        id: version
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'none' }}
        run: ./tools/release-workflow.ps1 -Step ValidateVersion

      - name: Check release version and protect existing releases
        id: release-history
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_EDITION == 'github' && inputs.release_mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/Circular_Kotlin/.local/github
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: ./tools/release-workflow.ps1 -Step CheckReleaseHistory

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Circular_Kotlin/.local/gradle-home/caches
            Circular_Kotlin/.local/gradle-home/wrapper
          key: windows-circular-gradle-${{ hashFiles('Circular_Kotlin/gradle/wrapper/gradle-wrapper.properties', 'Circular_Kotlin/gradle/libs.versions.toml', 'Circular_Kotlin/*.gradle.kts', 'Circular_Kotlin/app/*.gradle.kts', 'Circular_Kotlin/gradle.properties') }}-release-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-circular-gradle-${{ hashFiles('Circular_Kotlin/gradle/wrapper/gradle-wrapper.properties', 'Circular_Kotlin/gradle/libs.versions.toml', 'Circular_Kotlin/*.gradle.kts', 'Circular_Kotlin/app/*.gradle.kts', 'Circular_Kotlin/gradle.properties') }}-
            windows-circular-gradle-

      - name: Build signed Release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.Circular_KEYSTORE_B64 }}
          CIRCULAR_KEYSTORE_PASSWORD: ${{ secrets.Circular_STORE_PASS }}
          CIRCULAR_KEY_ALIAS: ${{ secrets.Circular_KEY_ALIAS }}
          CIRCULAR_KEY_PASSWORD: ${{ secrets.Circular_KEY_PASS }}
        run: ./tools/release-workflow.ps1 -Step BuildSignedApk

      - name: Verify original APK and prepare verified download files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: ./tools/release-workflow.ps1 -Step VerifyAndPackageApk

      - name: Retain APK and checksum for 14 days
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/${{ steps.version.outputs.apk_name }}
            Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/SHA256SUMS.txt
            Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/RELEASE.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Generate release description from Git history
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_EDITION == 'github' && inputs.release_mode != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
          BASE_COMMIT: ${{ steps.release-history.outputs.base_commit }}
        run: ./tools/release-workflow.ps1 -Step GenerateChangelog

      - name: Create a complete draft release
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_EDITION == 'github' && inputs.release_mode != 'none'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Circular ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          draft: true
          prerelease: ${{ inputs.release_mode == 'prerelease' }}
          body_path: Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/CHANGELOG.md
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/${{ steps.version.outputs.apk_name }}
            Circular_Kotlin/delivery/${{ steps.version.outputs.version }}/SHA256SUMS.txt

      - name: Publish the selected Release or prerelease
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_EDITION == 'github' && (inputs.release_mode == 'release' || inputs.release_mode == 'prerelease')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/Circular_Kotlin/.local/github
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: ./tools/release-workflow.ps1 -Step PublishRelease

      - name: Ensure this run's signing file is removed
        if: always()
        run: ./tools/release-workflow.ps1 -Step RemoveSigningFile
